# SPDX-License-Identifier: MIT or Apache-2.0

[package]
name = "aruna-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Integration tests build as one binary; declare each new tests/ file in tests/main.rs.
autotests = false

[features]
# Test seams for integration tests; only dev-dependencies enable it.
test-hooks = []

[dependencies]
aruna-clock = { workspace = true }
aruna-core = { workspace = true }
blake3 = { workspace = true }
iroh = { workspace = true }
irokle = { workspace = true }
lru = { workspace = true }
fjall = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
postcard = { workspace = true, features = ["alloc"] }
serde = { workspace = true }
governor = { workspace = true }
byteview = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
smallvec = { workspace = true }
crossfire = { workspace = true }
ulid = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
aruna-clock = { workspace = true, features = ["test-hooks"] }
aruna-core = { workspace = true, features = ["test-hooks"] }
aruna-storage = { workspace = true, features = ["test-hooks"] }
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "integration"
path = "tests/main.rs"
