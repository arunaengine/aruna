# Workspace manifest: members, shared package metadata and dependency versions.
# Copyright (c) 2026 The Aruna Contributors
# SPDX-License-Identifier: MIT or Apache-2.0

[workspace]
members = [
    "api",
    "aruna",
    "blob",
    "compute",
    "core",
    "kpabe",
    "kpabe/wasm",
    "storage",
    "net",
    "tasks",
    "operations",
    "aruna-doctor",
    "scripts/compute-helper",
]
# default-members = ["aruna"]
resolver = "3"

[workspace.package]
description = "A federated data orchestration network"
version = "3.0.0-alpha.106"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arunaengine/aruna"
rust-version = "1.97.1"

[workspace.dependencies]
aruna-kpabe = { path = "kpabe" }
# Workspace crates
aruna = { path = "aruna" }
aruna-api = { path = "api" }
aruna-blob = { path = "blob" }
aruna-compute = { path = "compute", default-features = false }
aruna-core = { path = "core" }
aruna-net = { path = "net" }
aruna-operations = { path = "operations" }
aruna-storage = { path = "storage" }
aruna-tasks = { path = "tasks" }

# Third-party crates
aes-gcm = "0.11.1"
aes-gcm-core = { package = "aes-gcm", version = "0.11.1", default-features = false, features = ["aes", "zeroize"] }
ahash = "0.8.12"
async-compression = { version = "0.4.50", default-features = false, features = [
    "tokio",
    "deflate",
] }
async-trait = "0.1.92"
async_zip = { package = "astral_async_zip", version = "0.0.22", features = [
    "tokio",
    "deflate",
] }
aws-config = { version = "1.12.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = [
    "default-https-client",
    "http-1x",
    "rt-tokio",
] }
aws-smithy-http-client = { version = "1.5.0", default-features = false, features = [
    "rustls-aws-lc",
] }
aws-smithy-runtime-api = { version = "1.19.0", features = ["client"] }
axum = "0.8.9"
bao-tree = "0.16.1"
base64 = "0.23.1"
blake3 = { version = "=1.8.7", features = ["serde"] }
bls12_381_plus = { version = "=0.9.0", default-features = false, features = ["groups", "pairings", "alloc"] }
bollard = "0.21.1"
byteview = "0.10.2"
bytes = "1.12.1"
cap-std = "4.0.3"
cel-interpreter = "0.10.0"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
# Pinned to craqle 0.3.2 main with Irokle 0.3.2; it resolves the irokle below.
craqle = { git = "https://github.com/arunaengine/craqle", rev = "9a21ab6fb1cf535ccf412db2ba35583f41d62ddf", features = [
    "iroh",
    "shacl-core",
] }
crc-fast = "1.10.0"
crossfire = "3.1.20"
crypto_box = "0.9.1"
dirs = "7.0.0"
dotenvy = "0.15.7"
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
fjall = "3.1.12"
flate2 = "1.1.10"
futures = "0.3.34"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", features = ["io"] }
getrandom = "0.4.3"
governor = "0.10.4"
globset = "0.4.20"
hex = "0.4.3"
hpke = { version = "0.14.1", default-features = false, features = [
    "alloc",
    "aes",
    "getrandom",
    "x25519",
] }
http = "1.5.0"
http-body = "1.1.0"
httparse = "1.10.1"
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = { version = "0.1.21", features = [
    "server",
    "server-auto",
    "http1",
    "http2",
    "tokio",
    "service",
] }
ipnet = "2.12.2"
iroh = "1.3.0"
# Pinned to the exact revision craqle uses so one irokle crate is resolved.
irokle = { git = "https://github.com/arunaengine/irokle.git", rev = "209f881af3fa4b8ed16e2ca0a0315d663029329e", features = [
    "fjall",
    "iroh",
] }
iroh-io = "0.6.2"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
json-patch = "4.2.0"
lru = "0.18.5"
md5 = "0.8.1"
mime = "0.3.17"
nix = { version = "0.31.3", features = ["time", "fs", "process", "signal"] }
opendal = { version = "0.59.4", features = [
    "services-azblob",
    "services-azdls",
    "services-b2",
    "services-fs",
    "services-gcs",
    "services-s3",
    "services-http",
    "services-webdav",
] }
opendal-http-transport-reqwest = { version = "0.59.4", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false, features = [
    "trace",
] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
    "trace",
    "grpc-tonic",
] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = [
    "trace",
    "rt-tokio",
] }
oxrdf = "0.3.4"
oxttl = "0.2.4"
parking_lot = { version = "0.12.5", features = ["deadlock_detection"] }
pbkdf2 = "0.13.0"
percent-encoding = "2.3.2"
pithos_lib = { version = "0.8.0", default-features = false, features = ["async"] }
postcard = { version = "1.1.3", features = ["alloc"] }
prometheus-client = "0.25"
proptest = "1.11.0"
quick-xml = "0.42.0"
rand = "0.10.3"
rand_core = { version = "0.10.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }
rmcp = { version = "3.5.1", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
rustls = { version = "0.23.45", features = ["ring"] }
kube = { version = "4.2.0", default-features = false, features = [
    "client",
    "jsonpatch",
    "runtime",
    "rustls-tls",
    "ws",
] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
s3s = "0.17.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde-saphyr = "1.3.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
sha2_010 = { package = "sha2", version = "0.10.9", default-features = false }
smallvec = "1.15.2"
spargebra = "0.4.7"
subtle = "2.6.1"
sysinfo = { version = "0.39.6", default-features = false, features = [
    "system",
] }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
thiserror-core = { package = "thiserror", version = "2.0.21", default-features = false }
tokio = { version = "1.53.2", features = ["full", "tracing"] }
toml = "1.1.8"
tokio-util = { version = "0.7.20", features = ["compat", "io-util", "rt"] }
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "cors", "fs", "timeout"] }
tracing = "0.1.44"
tracing-core = "0.1.36"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "time",
    "fmt",
    "json",
    "registry",
] }
ulid = { version = "3.0.0", features = ["serde"] }
unicode-normalization = "0.1.25"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
utoipa = { version = "6.0.0", features = [
    "chrono",
    "axum_extras",
    "ulid",
    "url",
] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
# Exact: the portal's wasm-bindgen-cli must match this version.
wasm-bindgen = "=0.2.127"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = "1.9.1"
zip = { version = "9.0.1", default-features = false }
zstd = "0.14.1"

[profile.release]
panic = "abort"

# Tests spin up real multi-node clusters, so unoptimized dependencies dominate
# their runtime; workspace crates stay at opt-level 0 for compile speed and
# coverage fidelity.
[profile.dev.package."*"]
opt-level = 3
