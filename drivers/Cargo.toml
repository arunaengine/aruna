[package]
name = "aruna-drivers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Shared test helpers; only dev-dependencies enable it.
test-hooks = []

[dependencies]
aruna-blob = { workspace = true }
aruna-compute = { workspace = true, default-features = false }
aruna-core = { workspace = true }
aruna-graph = { workspace = true }
aruna-net = { workspace = true }
aruna-outbound = { workspace = true }
aruna-storage = { workspace = true }
aruna-tasks = { workspace = true }
bytes = { workspace = true }
byteview = { workspace = true }
craqle = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
irokle = { workspace = true }
rand = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
aruna-core = { workspace = true, features = ["test-hooks"] }
aruna-storage = { workspace = true, features = ["test-hooks"] }
iroh = { workspace = true }
smallvec = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
