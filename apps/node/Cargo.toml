# Manifest of the aruna binary, with one feature per compute backend.
# Copyright (c) 2026 The Aruna Contributors
# SPDX-License-Identifier: MIT or Apache-2.0

[package]
name = "aruna"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Integration tests build as seven regime binaries; declare each new tests/ file in its regime root.
autotests = false

[features]
default = ["docker", "apptainer", "kubernetes"]
docker = ["aruna-compute/docker"]
apptainer = ["aruna-compute/apptainer"]
kubernetes = ["aruna-compute/kubernetes"]
slurm = ["aruna-compute/slurm"]

[dependencies]
# Aruna modules
aruna-admission = { workspace = true }
aruna-api = { workspace = true }
aruna-nfs = { workspace = true }
aruna-smb = { workspace = true }
aruna-wire = { workspace = true }
aruna-blob = { workspace = true }
aruna-compute = { workspace = true, default-features = false }
aruna-clock = { workspace = true }
aruna-config = { workspace = true }
aruna-core = { workspace = true }
aruna-rdf-graph = { workspace = true }
aruna-p2p = { workspace = true }
aruna-ops-data = { workspace = true }
aruna-ops-identity = { workspace = true }
aruna-ops-work = { workspace = true }
aruna-runner = { workspace = true }
aruna-storage = { workspace = true }
aruna-vfs = { workspace = true }
aruna-egress = { workspace = true }
aruna-gateway = { workspace = true }
aruna-plugin-contract = { workspace = true }
aruna-wasm-host = { workspace = true, features = ["runtime"] }
aruna-scheduler = { workspace = true }
aruna-workflow = { workspace = true }
aruna-workflow-contract = { workspace = true }
irokle = { workspace = true }

# The rest
async-trait = { workspace = true }
crypto_box = { workspace = true }
dirs = { workspace = true }
dotenvy = { workspace = true }
fjall = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
iroh = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
postcard = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
byteview = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
flate2 = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
aruna-clock = { workspace = true, features = ["test-hooks"] }
aruna-api = { workspace = true, features = ["test-hooks"] }
aruna-test-harness = { workspace = true }
aruna-cli = { workspace = true, features = ["test-hooks"] }
aruna-core = { workspace = true, features = ["test-hooks"] }
aruna-p2p = { workspace = true, features = ["test-hooks"] }
aruna-storage = { workspace = true, features = ["test-hooks"] }
async_zip = { workspace = true }
bytes = { workspace = true }
craqle = { workspace = true }
getrandom = { workspace = true }
oxrdf = { workspace = true }
percent-encoding = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
url = { workspace = true }
zip = { workspace = true }
aruna-ops-data = { workspace = true, features = ["test-hooks"] }
aruna-ops-work = { workspace = true, features = ["test-hooks"] }
aruna-runner = { workspace = true, features = ["test-hooks"] }
keyring-core = { workspace = true }
aruna-kpabe = { workspace = true }
md5 = { workspace = true }
axum = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-smithy-http-client = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
rcgen = { workspace = true }
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
tempfile = { workspace = true }

[[test]]
name = "regimes"
path = "tests/regimes.rs"

# Prints workload rates on request (cargo run --release --example measure); never a test.
[[example]]
name = "measure"
test = false
