# Manifest of the aruna binary, with one feature per compute backend.
# Copyright (c) 2026 The Aruna Contributors
# SPDX-License-Identifier: MIT or Apache-2.0

[package]
name = "aruna"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Integration tests build as one binary; declare each new tests/ file in tests/main.rs.
autotests = false

[features]
default = ["docker", "apptainer", "kubernetes"]
docker = ["aruna-compute/docker"]
apptainer = ["aruna-compute/apptainer"]
kubernetes = ["aruna-compute/kubernetes"]
slurm = ["aruna-compute/slurm"]

[dependencies]
# Aruna modules
aruna-api = { workspace = true }
aruna-wire = { workspace = true }
aruna-blob = { workspace = true }
aruna-compute = { workspace = true, default-features = false }
aruna-core = { workspace = true }
aruna-graph = { workspace = true }
aruna-net = { workspace = true }
aruna-operations = { workspace = true }
aruna-storage = { workspace = true }
aruna-outbound = { workspace = true }
aruna-plugins = { workspace = true, features = ["runtime"] }
aruna-tasks = { workspace = true }
irokle = { workspace = true }

# The rest
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
crypto_box = { workspace = true }
dirs = { workspace = true }
ipnet = { workspace = true }
dotenvy = { workspace = true }
ed25519-dalek = { workspace = true }
fjall = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
iroh = { workspace = true }
jsonwebtoken = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
postcard = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
byteview = { workspace = true }
rand = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
aruna-cli = { workspace = true }
aruna-core = { workspace = true, features = ["test-hooks"] }
aruna-storage = { workspace = true, features = ["test-hooks"] }
async_zip = { workspace = true }
bytes = { workspace = true }
craqle = { workspace = true }
oxrdf = { workspace = true }
percent-encoding = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
url = { workspace = true }
zip = { workspace = true }
aruna-operations = { workspace = true, features = ["test-hooks"] }
keyring-core = { workspace = true }
aruna-kpabe = { workspace = true }
axum = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-smithy-http-client = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
rcgen = { workspace = true }
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
tempfile = { workspace = true }

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "operations"
path = "tests/operations/main.rs"

# Prints workload rates on request (cargo run --release --example measure); never a test.
[[example]]
name = "measure"
test = false
