[package]
name = "aruna-operations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Integration tests build as one binary; declare each new tests/ file in tests/main.rs.
autotests = false

[features]
# Test seams and shared test helpers; only dev-dependencies enable it.
test-hooks = []

[dependencies]
aruna-blob = { workspace = true }
aruna-compute = { workspace = true, default-features = false }
aruna-core = { workspace = true }
aruna-plugins = { workspace = true, features = ["runtime"] }
aruna-storage = { workspace = true }
aruna-net = { workspace = true }
aruna-outbound = { workspace = true }
aruna-tasks = { workspace = true }
craqle = { workspace = true }
async-compression = { workspace = true }
async-trait = { workspace = true }
async_zip = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
md5 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
byteview = { workspace = true }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
globset = { workspace = true }
fjall = { workspace = true }
rustix = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
iroh = { workspace = true }
irokle = { workspace = true }
jsonwebtoken = { workspace = true }
lru = { workspace = true }
opentelemetry = { workspace = true }
postcard = { workspace = true }
quick-xml = { workspace = true }
rand = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
spareval = { workspace = true }
spargebra = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
ulid = { workspace = true }
unicode-normalization = { workspace = true }
ed25519-dalek = { workspace = true }
oxrdf = { workspace = true }
oxttl = { workspace = true }
percent-encoding = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }

[dev-dependencies]
aruna-core = { workspace = true, features = ["test-hooks"] }
aruna-operations = { workspace = true, features = ["test-hooks"] }
aruna-storage = { workspace = true, features = ["test-hooks"] }
axum = { workspace = true }
flate2 = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
zip = { workspace = true }

[[test]]
name = "integration"
path = "tests/main.rs"

# Prints workload rates on request (cargo run --release --example measure); never a test.
[[example]]
name = "measure"
test = false
