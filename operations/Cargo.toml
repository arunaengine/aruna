[package]
name = "aruna-operations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Integration tests build as one binary; declare each new tests/ file in tests/main.rs.
autotests = false

[features]
# Test seams and shared test helpers; only dev-dependencies enable it.
test-hooks = [
    "dep:tempfile",
    "dep:aruna-blob",
    "dep:aruna-graph",
    "dep:aruna-storage",
    "dep:aruna-net",
    "dep:aruna-outbound",
    "dep:tokio",
    "dep:tokio-util",
    "dep:axum",
    "dep:aruna-drivers",
    "dep:aruna-tasks",
    "aruna-drivers/test-hooks",
    "aruna-net/test-hooks",
    "aruna-storage/test-hooks",
]

[dependencies]
axum = { workspace = true, optional = true }
aruna-blob = { workspace = true, optional = true }
aruna-core = { workspace = true }
aruna-drivers = { workspace = true, optional = true }
aruna-graph = { workspace = true, optional = true }
aruna-plugin-types = { workspace = true }
aruna-storage = { workspace = true, optional = true }
aruna-net = { workspace = true, optional = true }
aruna-outbound = { workspace = true, optional = true }
aruna-tasks = { workspace = true, optional = true }
craqle = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
md5 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
byteview = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
globset = { workspace = true }
futures-util = { workspace = true }
iroh = { workspace = true }
irokle = { workspace = true }
jsonwebtoken = { workspace = true }
postcard = { workspace = true }
quick-xml = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
spareval = { workspace = true }
spargebra = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
ed25519-dalek = { workspace = true }
oxrdf = { workspace = true }
oxttl = { workspace = true }
percent-encoding = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
aruna-blob = { workspace = true }
aruna-graph = { workspace = true }
aruna-net = { workspace = true }
aruna-outbound = { workspace = true }
async_zip = { workspace = true }
tokio-util = { workspace = true }
aruna-compute = { workspace = true, default-features = false }
aruna-core = { workspace = true, features = ["test-hooks"] }
aruna-drivers = { workspace = true, features = ["test-hooks"] }
aruna-operations = { workspace = true, features = ["test-hooks"] }
aruna-storage = { workspace = true, features = ["test-hooks"] }
aruna-tasks = { workspace = true }
axum = { workspace = true }
flate2 = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
zip = { workspace = true }
