# Manifest of aruna-cli, the command line client for a realm's REST and S3 APIs.
# Copyright (c) 2026 The Aruna Contributors
# SPDX-License-Identifier: MIT or Apache-2.0

[package]
name = "aruna-cli"
description = "Command line client for an Aruna realm's REST and S3 APIs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "aruna-cli"
path = "src/main.rs"

[dependencies]
aws-sdk-s3 = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
# Selects the pure Rust backend that zip's deflate support needs.
flate2 = { workspace = true }
hostname = { workspace = true }
keyring = { workspace = true }
md5 = { workspace = true }
reqwest = { workspace = true, features = ["query"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
zip = { workspace = true, features = ["deflate-flate2"] }
