# Grafana provisioning that loads the Aruna dashboards from disk.
# Copyright (c) 2026 The Aruna Contributors
# SPDX-License-Identifier: MIT or Apache-2.0

apiVersion: 1

providers:
  - name: Aruna
    orgId: 1
    folder: Aruna
    type: file
    disableDeletion: true
    editable: false
    options:
      path: /var/lib/grafana/dashboards
