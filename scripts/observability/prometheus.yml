global:
  scrape_interval: 15s
  scrape_timeout: 5s

# Only the application-native rules whose inputs this scrape actually ingests:
# no-ready, restart-loop, and forced-shutdown alerts need unscraped Kubernetes
# or log telemetry, so they stay manual checks rather than inert rules.
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: aruna
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - 127.0.0.1:3002
