global:
  scrape_interval: 15s
  scrape_timeout: 5s

# Only the application-native rules whose inputs this scrape actually ingests.
# No-ready, restart-loop, and forced-shutdown alerts need Kubernetes or log
# telemetry that is not scraped here; they stay manual checks rather than
# inert rules.
rule_files:
  - aruna-alerts.yml

scrape_configs:
  - job_name: aruna
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - 127.0.0.1:3002
