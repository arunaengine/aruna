hex = { workspace = true }
http = { workspace = true }
iroh = { workspace = true }
irokle = { workspace = true }
md5 = { workspace = true }
oxrdf = { workspace = true }
oxttl = { workspace = true }
percent-encoding = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spargebra = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
url = { workspace = true }

[dev-dependencies]
aruna-blob = { workspace = true }
aruna-core = { workspace = true, features = ["test-hooks"] }
aruna-runner = { workspace = true, features = ["test-hooks"] }
