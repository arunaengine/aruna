# Frees runner disk space by removing preinstalled SDKs the Aruna jobs never use.
# Copyright (c) 2026 The Aruna Contributors
# SPDX-License-Identifier: MIT or Apache-2.0

name: Free disk space
description: Removes the Android, .NET, Haskell and CodeQL installs and prints the free space.
runs:
  using: composite
  steps:
    # A full root disk stops the runner itself, which then loses its log and the job.
    - name: Remove unused SDKs
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h / /mnt
