# Frees runner disk space by removing preinstalled SDKs the Aruna jobs never use.
# Copyright (c) 2026 The Aruna Contributors
# SPDX-License-Identifier: MIT or Apache-2.0

name: Free disk space
description: Removes the Android, .NET, Haskell and CodeQL installs and prints the free space.
runs:
  using: composite
  steps:
    # A full root disk stops the runner itself, which then loses its log and the job.
    - name: Remove unused SDKs
      shell: bash
      run: |
        set -euo pipefail
        # 55 GiB in KiB; runners with that much free space skip the slow deletes.
        avail_kb="$(df --output=avail / | tail -n 1 | tr -d ' ')"
        if [ "$avail_kb" -ge 57671680 ]; then
          echo "enough free disk space, nothing removed"
          df -h / /mnt
          exit 0
        fi
        for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
          sudo rm -rf "$dir" &
        done
        wait
        df -h / /mnt
