name: coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Source-based coverage reads __llvm_covmap from the binary, so DWARF is
  # dead weight that OOM-kills the 16 GB runner during linking.
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 2
  RUSTFLAGS: -Cinstrument-coverage -Cdebuginfo=0

jobs:
  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    # Job-level hang cap, not a performance budget. Test concurrency and the
    # per-test hang cap live in .config/nextest.toml; restart profiles run below.
    timeout-minutes: 120
    env:
      # nextest runs one process per test, so %m merges each binary's counters
      # into one file instead of writing a profraw per test process.
      LLVM_PROFILE_FILE: cargo-test-%m.profraw
      # Instrumented frames are larger, so deep async tests overflow the 2 MiB default.
      RUST_MIN_STACK: 8388608

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust with LLVM tools
        # rust-toolchain.toml supplies the channel used to build the tests.
        run: rustup component add llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Install grcov
        uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2.83.3
        with:
          tool: grcov@0.10.7

      - name: Install cargo-nextest
        uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2.83.3
        with:
          tool: cargo-nextest@0.9.140

      # The measured target set matches the main tests job, so a coverage move
      # cannot come from a different target selection.
      - name: Run instrumented tests
        run: cargo nextest run --workspace --all-targets --all-features --locked --profile ci

      # nextest never runs doctests; they stay in the measured set.
      - name: Run instrumented doctests
        run: cargo test --workspace --all-features --locked --doc

      - name: Collect coverage
        run: |
          grcov . \
            --binary-path ./target/debug/deps/ \
            --source-dir . \
            --output-type lcov \
            --output-path coverage.lcov \
            --branch \
            --ignore-not-existing \
            --ignore "/*" \
            --ignore "target/*" \
            --ignore "*/src/**/tests/*" \
            --ignore "*/src/**/tests.rs" \
            --keep-only "*/src/*"
          # Extracted test files are excluded; inline test code remains in its source file.
          source_files="$(grep '^SF:' coverage.lcov | sed 's/^SF://' | sort -u)"
          printf 'coverage source files: %s\n' "$(printf '%s\n' "$source_files" | wc -l)"
          printf '%s\n' "$source_files" > coverage-sources.txt
          if printf '%s\n' "$source_files" | grep -Eq '/src/(.*/)?tests?(/|\.rs$)'; then
            echo "coverage.lcov contains test sources:" >&2
            printf '%s\n' "$source_files" | grep -E '/src/(.*/)?tests?(/|\.rs$)' >&2
            exit 1
          fi
          records=$(grep -c '^DA:' coverage.lcov || true)
          if [ "$records" -lt 1000 ]; then
            echo "coverage.lcov has only $records DA records" >&2
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            coverage.lcov
            coverage-sources.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload JUnit report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-instrumented
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7

  report:
    name: Generate Coverage Report
    environment: coverage
    needs: [instrumented, restart-stress]
    if: ${{ needs.instrumented.result == 'success' && needs.restart-stress.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage
          path: coverage-parts

      - name: Validate coverage
        run: |
          set -euo pipefail
          records=$(grep -c '^DA:' coverage-parts/coverage.lcov || true)
          if [ "$records" -lt 1000 ]; then
            echo "coverage.lcov has only $records DA records" >&2
            exit 1
          fi
          grep '^SF:' coverage-parts/coverage.lcov | sed 's/^SF://' | sort -u \
            | diff -u coverage-parts/coverage-sources.txt -

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-parts/coverage.lcov
          fail_ci_if_error: true

  restart-stress:
    name: Restart scale stress
    runs-on: ubuntu-latest
    # This is a non-instrumented functional stress lane, not a normal timing
    # assertion; keep it bounded so a deadlock still fails the PR promptly.
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      RUSTFLAGS: -Cdebuginfo=0

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust
        run: rustup show active-toolchain

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run restart scale tests
        run: |
          set -euo pipefail
          cargo test -p aruna-operations --test restart_traffic \
            --all-features --locked offline_scale_ -- --ignored
