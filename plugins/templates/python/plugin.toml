# Plugin manifest: what the plugin asks for. Build with `aruna-cli plugin build`.
name = "{{name}}"
version = "0.1.0"

[triggers]
manual = { handler = "run" }

[permissions]
required = []

[build]
command = ["uv", "run", "--no-project", "--with", "componentize-py==0.25.1", "componentize-py", "-d", "wit", "-w", "plugin", "componentize", "app", "-o", "plugin.wasm"]
output = "plugin.wasm"
