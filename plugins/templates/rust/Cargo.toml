# Rust plugin project; `aruna-cli plugin build` writes the library to .aruna/rust and compiles the
# project to wasm32-unknown-unknown.
[package]
name = "{{name}}"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aruna = { package = "aruna-plugin", path = ".aruna/rust/aruna-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
