# Rust plugin project; `aruna-cli plugin build` compiles it to wasm32-unknown-unknown.
[package]
name = "{{name}}"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aruna-plugin = { git = "https://github.com/arunaengine/aruna", branch = "main" }
serde_json = "1"
