# Example plugin: syncs tagged eLabFTW experiments and datasets below meta/elabftw both ways.
# Copyright (c) 2026 The Aruna Contributors
# SPDX-License-Identifier: MIT or Apache-2.0

name = "elabftw-sync"
version = "0.1.0"
title = "Sync eLabFTW experiments"
on = ["timer", "dataset_created", "dataset_updated", "manual"]
access = "write"

[settings]
elab_url = { title = "eLabFTW address", type = "url" }
sync_user = { title = "eLabFTW user id of the sync user", type = "integer" }
writers = { title = "Writers of new experiments: user ids, group:<id> for team groups", default = "" }
bucket = "Bucket path of eLabFTW's uploads on the receiver node"
prefix = { title = "eLabFTW's path prefix in the bucket", default = "elabftw" }
tag = { title = "Tag of synced experiments", default = "aruna" }
aruna_url = { title = "Aruna portal address", type = "url" }

[services.elab]
url = "{elab_url}/api/v2/experiments"
methods = ["GET", "POST", "PATCH"]
secret = { title = "eLabFTW API key of the sync user", kind = "header" }

[timer]
every = "5m"
