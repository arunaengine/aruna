name = "fixture"
version = "0.2.0"
title = "Runtime test guest"
on = ["manual", "timer", "dataset_created", "dataset_updated", "data_uploaded", "sync_completed", "sync_failed"]
access = "write"

[settings]
api_url = { title = "API address", type = "url", default = "https://api.example.org" }

[services.api]
url = "{api_url}/v1"
methods = ["GET", "POST"]
secret = "API key"

[timer]
every = "1h"
