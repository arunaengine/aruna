[graph]
all-features = true

[advisories]
yanked = "deny"
# Pre-existing transitive advisories acknowledged for deliberate follow-up
# updates; new advisories beyond this set still fail the gate.
ignore = [
    "RUSTSEC-2023-0071", # rsa Marvin timing sidechannel, no fixed release
    "RUSTSEC-2026-0387", # crypto-bigint 0.5 via elliptic-curve 0.13 (jsonwebtoken, bls12_381_plus), no 0.5 fix
    "RUSTSEC-2023-0089", # atomic-polyfill unmaintained (transitive)
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained (transitive)
    "RUSTSEC-2024-0436", # paste unmaintained (transitive)
    "RUSTSEC-2026-0194", # quick-xml quadratic parse via RDF stack (upstream craqle)
    "RUSTSEC-2026-0195", # quick-xml namespace allocation via RDF stack (upstream craqle)
    "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained via rudof_rdf/tabled (upstream craqle)
    # Yanked; via ro-crate-rs (craqle) and the utoipa-swagger-ui build script, no zip 9 upstream yet
    { crate = "zip@8.6.0", reason = "yanked; waiting for upstream to move to zip 9" },
    # zip 8 extract() advisories; ro-crate-rs and utoipa-swagger-ui never call extract()
    "RUSTSEC-2026-0367", # zip extract keeps SUID/SGID bits
    "RUSTSEC-2026-0368", # zip extract creates symlinks outside the target
    "RUSTSEC-2026-0369", # zip extract applies permissions through symlinks
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "zlib-acknowledgement",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/arunaengine/craqle",
    "https://github.com/arunaengine/irokle.git",
    "https://github.com/arunaengine/ro-crate-rs.git",
]
